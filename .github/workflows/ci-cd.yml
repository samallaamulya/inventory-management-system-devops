name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # ---------- CI: lint + test ----------
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: flake8 .

      - name: Run tests
        run: pytest -v

  # ---------- CI: build Docker image and smoke-test it ----------
  build:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t inventory-app:ci .

      - name: Smoke test container
        run: |
          docker run -d --name inv -p 5000:5000 inventory-app:ci
          for i in $(seq 1 15); do
            curl -fs http://localhost:5000/health && exit 0
            sleep 2
          done
          docker logs inv
          exit 1

  # ---------- CD: publish image to GitHub Container Registry ----------
  publish:
    name: Publish image
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ---------- CD: deploy to a server over SSH (optional) ----------
  deploy:
    name: Deploy to server
    needs: publish
    runs-on: ubuntu-latest
    # Runs only if you have added the DEPLOY_HOST secret (see README).
    if: vars.ENABLE_DEPLOY == 'true'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            docker pull ${{ env.IMAGE_NAME }}:latest
            docker stop inventory || true
            docker rm inventory || true
            docker run -d --name inventory --restart unless-stopped \
              -p 80:5000 -v inventory-data:/data \
              ${{ env.IMAGE_NAME }}:latest
